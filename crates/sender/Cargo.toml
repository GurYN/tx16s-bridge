[package]
name = "tx16s-sender"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Streams a RadioMaster TX16S to a PC over the local network"

[dependencies]
dirs = "6"
gpui = "0.2"
hidapi = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tx16s-protocol = { path = "../protocol" }
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
